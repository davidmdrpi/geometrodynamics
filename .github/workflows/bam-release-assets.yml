name: BAM release assets
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'geometrodynamics/**'
      - 'docs/releases/**'
      - 'docs/images/releases/**'
      - 'scripts/*bam*release*'
      - 'scripts/bam_release_catalog.py'
      - 'CITATION.cff'
      - 'CHANGELOG.md'
      - '.github/workflows/bam-release-assets.yml'
  push:
    tags: ['v1.3.5']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install setuptools wheel
      - run: python scripts/build_bam_release_assets.py --output-dir dist/bam-1.3.5
      - uses: actions/upload-artifact@v4
        with:
          name: bam-1.3.5-release-assets
          path: dist/bam-1.3.5/*
          if-no-files-found: error
