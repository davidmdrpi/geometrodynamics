name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Check localized evidence portability
        # Check archived numerical evidence on each runner before the longer
        # full suite. Includes a fresh-process CPU-dispatch portability test.
        run: pytest -q tests/test_localized_mouth.py tests/test_mouth_momentum.py tests/test_localized_mouth_error_budget.py
      - name: Run full test suite
        run: pytest -q
