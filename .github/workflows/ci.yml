name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Source audits read their pinned baseline out of git history
          # (`git show <baseline>:<path>`, `git grep <baseline>`). The default
          # shallow clone does not contain that commit, so those checks fail
          # with exit 128 on the runner while passing locally.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Verify packet, Floquet and two-region replay
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: pytest -q tests/test_finite_packet.py tests/test_esu_floquet.py tests/test_two_regions.py tests/test_two_regions_controls.py
      - name: Verify packet replay with alternate CPU dispatch
        env:
          OPENBLAS_NUM_THREADS: "1"
          OPENBLAS_CORETYPE: Haswell
        run: pytest -q tests/test_finite_packet.py
      - name: Run test suite
        run: pytest -q
