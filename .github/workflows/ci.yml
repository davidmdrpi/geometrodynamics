name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Source audits read their pinned baseline out of git history
          # (`git show <baseline>:<path>`, `git grep <baseline>`). The default
          # shallow clone does not contain that commit, so those checks fail
          # with exit 128 on the runner while passing locally.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Verify packet, Floquet and two-region replay
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: pytest -q tests/test_finite_packet.py tests/test_esu_floquet.py tests/test_two_regions.py tests/test_two_regions_controls.py tests/test_action_selection.py tests/test_selection_plateau.py
      - name: Verify packet replay with alternate CPU dispatch
        env:
          OPENBLAS_NUM_THREADS: "1"
          OPENBLAS_CORETYPE: Haswell
        run: pytest -q tests/test_finite_packet.py
      - name: Verify R3 historical replay and review controls
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: pytest -q tests/test_r3_resonance.py tests/test_r3_review_controls.py
      - name: Verify normal-quotient replay and controls
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: pytest -q tests/test_r3_normal_quotient.py
      - name: Verify finite-aperture transfer and disclosed diagnostic correction
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: pytest -q tests/test_aperture_transfer.py
      - name: Verify aperture replay with baseline NumPy dispatch
        env:
          OPENBLAS_NUM_THREADS: "1"
          NPY_DISABLE_CPU_FEATURES: "AVX2,FMA3,AVX512F"
        run: pytest -q tests/test_aperture_transfer.py
      - name: Verify phase family and authenticated failed-retention result
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: |
          pytest -q tests/test_aperture_phase.py tests/test_aperture_phase_evidence.py
          python -m experiments.closure_ledger.aperture_phase_probe --manifest-sha 02b8bd392282292cbf0f82a42dfdf17ba2263a84b709bebf38217fa394037a6d
      - name: Run test suite
        run: pytest -q
      - name: Verify reduced MTY packet experiment
        env:
          OPENBLAS_NUM_THREADS: "1"
        run: pytest -q tests/test_mty_packet.py
